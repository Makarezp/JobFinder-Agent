{% extends "layout.html" %}

{% block content %}
<div class="flex-1 flex flex-col max-w-5xl mx-auto w-full p-4 h-full">
    <!-- Header -->
    <header class="mb-6 flex justify-between items-center py-4 border-b border-gray-200">
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">
            {{ app_name }}
        </h1>
        <div class="text-sm text-gray-500">
            Powered by LangGraph & Crawl4AI
        </div>
    </header>

    <!-- Chat Container -->
    <div id="chat-history"
        class="flex-1 overflow-y-auto mb-6 p-4 bg-white rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 scroll-smooth">
        <!-- Welcome Message -->
        <div class="flex flex-col space-y-2 mb-4 animate-fade-in">
            <div class="flex items-start">
                <div class="bg-indigo-50 text-indigo-900 p-4 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm">
                    <p class="font-medium">Hello! I'm an AI scraper bot. Ask me questions about any website URL, and
                        I'll investigate.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="mt-auto">
        <form hx-post="/chat" hx-target="#chat-history" hx-swap="beforeend" hx-on::after-request="this.reset()"
            class="relative">
            <div id="loading"
                class="htmx-indicator absolute -top-10 left-1/2 transform -translate-x-1/2 bg-white px-4 py-1 rounded-full shadow-md text-sm text-indigo-600 font-semibold border border-indigo-100">
                Thinking & Scraping...
            </div>

            <div class="flex space-x-2">
                <input type="text" name="message" placeholder="E.g., 'Extract pricing from https://openai.com/pricing'"
                    class="flex-1 p-4 rounded-xl border-2 border-gray-200 focus:border-indigo-500 focus:ring-0 transition-colors shadow-sm text-lg"
                    required autocomplete="off">
                <!-- Upload Button -->
                <label
                    class="cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 rounded-xl flex items-center justify-center transition-colors border-2 border-transparent hover:border-gray-300"
                    title="Upload CV">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 5.818l-5.123 5.122m-3.536 6.192l-9.193-9.193M12.75 8.25l4.755-4.754a6.714 6.714 0 019.536 9.536l-7.136 7.136a6.5 6.5 0 01-9.193-9.193l.879-.88" />
                    </svg>
                    <input type="file" name="file" accept=".pdf" class="hidden" hx-post="/upload-cv"
                        hx-encoding="multipart/form-data" hx-target="#chat-history" hx-swap="beforeend">
                </label>
                <button type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 rounded-xl font-bold transition-transform transform active:scale-95 shadow-md">
                    Send
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
