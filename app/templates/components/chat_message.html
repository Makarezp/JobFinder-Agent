<div class="flex flex-col space-y-4 mb-4 animate-fade-in">
    <!-- User Message -->
    <div class="flex items-end justify-end space-x-2">
        <div class="bg-blue-600 text-white p-4 rounded-2xl rounded-tr-none max-w-[80%] shadow-md">
            <p>{{ user_message }}</p>
        </div>
        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs">U
        </div>
    </div>

    <!-- AI Message -->
    <div class="flex flex-col space-y-2 items-start">
        <div class="flex items-start space-x-2">
            <div
                class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xs shrink-0">
                AI
            </div>
            <div
                class="bg-white border border-gray-100 dark:border-gray-800 text-gray-800 p-4 rounded-2xl rounded-tl-none max-w-[90%] shadow-sm prose prose-sm">
                {{ ai_message | safe }}
            </div>
        </div>

        <!-- Job Cards -->
        {% if jobs %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2 w-full pl-10 pr-4">
            {% for job in jobs %}
            <div
                class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition flex flex-col h-full">
                <div class="mb-2">
                    <h3 class="font-bold text-lg text-gray-800 leading-tight">{{ job.title }}</h3>
                    <p class="text-indigo-600 font-medium">{{ job.company }}</p>
                </div>

                <div class="text-sm text-gray-500 mb-3 space-y-1">
                    <div class="flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        {{ job.location }}
                    </div>
                    {% if job.salary %}
                    <div class="flex items-center gap-1 text-green-600 font-medium">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                            </path>
                        </svg>
                        {{ job.salary }}
                    </div>
                    {% endif %}
                </div>

                <p class="text-sm text-gray-600 mb-4 line-clamp-3">{{ job.description }}</p>

                <div class="mt-auto">
                    <a href="{{ job.apply_link }}" target="_blank"
                        class="block w-full text-center bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">
                        Apply Now
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</div>
